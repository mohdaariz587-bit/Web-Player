<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <!-- Updated CSP: Allowed saavncdn, jiosaavn, and saavn.dev for API and audio streaming -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com https://*.mzstatic.com; media-src 'self' https://*.saavncdn.com https://*.jiosaavn.com https://*.jiosaavn.net https://*.saavn.com; connect-src 'self' https://itunes.apple.com https://lrclib.net https://*.vercel.app https://saavn.sumit.co https://api.allorigins.win https://corsproxy.io; font-src 'none'; object-src 'none'; child-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'self'; form-action 'none';">
    <title>Heartz Player</title>
    <style>
        /* CSS Reset & Base Layout */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #060709;
            background-image: radial-gradient(circle at 50% 0%, #11161d 0%, #060709 75%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Song-Synced Full-Viewport Ambient Backdrop */
        .bg-ambient-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: #060709;
        }

        .bg-ambient-img {
            position: absolute;
            inset: -15%;
            width: 130%;
            height: 130%;
            object-fit: cover;
            filter: blur(110px) saturate(1.65) brightness(0.32);
            opacity: 0.75;
            transform: scale(1.08);
            transition: opacity 0.8s ease, transform 6s ease-in-out, filter 1.2s ease;
        }

        body.is-playing .bg-ambient-img {
            transform: scale(1.16);
            filter: blur(105px) saturate(1.9) brightness(0.38);
        }

        .bg-ambient-vignette {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 35%, transparent 0%, rgba(6, 7, 9, 0.72) 85%),
                linear-gradient(to bottom, rgba(6, 7, 9, 0.25) 0%, rgba(6, 7, 9, 0.88) 100%);
        }

        @media (max-width: 767px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .main-grid {
                padding: 1rem;
                display: flex;
                flex-direction: column;
            }
            .cover-card {
                min-height: 18rem;
                max-height: 22rem;
            }
            .playlist-card {
                height: 20rem;
            }
            .preview-card {
                min-height: 14rem;
            }
        }

        button {
            background: none;
            border: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        /* Apple iOS Glassmorphism */
        .ios-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Top Navigation Bar */
        .navbar {
            width: 100%;
            height: 4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            flex-shrink: 0;
            z-index: 40;
            gap: 1rem;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .brand-icon {
            width: 2rem;
            height: 2rem;
            color: #34d399;
        }

        .visualizer-box {
            flex: 1;
            max-width: 32rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            padding: 0 1rem;
            overflow: hidden;
        }

        /* Nav Actions & Playlist Dropdown */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .dropdown-wrapper {
            position: relative;
        }

        .nav-playlist-btn,
        .nav-lyrics-btn {
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-playlist-btn:hover,
        .nav-lyrics-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .dropdown-caret {
            width: 1rem;
            height: 1rem;
            transition: transform 0.2s ease;
        }

        .dropdown-wrapper.open .dropdown-caret {
            transform: rotate(180deg);
        }

        .playlist-dropdown {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            min-width: 10rem;
            border-radius: 1.25rem;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.96);
            transform-origin: top right;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
            z-index: 100;
        }

        .dropdown-wrapper.open .playlist-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .dropdown-item {
            width: 100%;
            text-align: left;
            padding: 0.625rem 1rem;
            border-radius: 0.875rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            transition: background-color 0.15s ease, color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .dropdown-item.active {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .dropdown-count {
            font-size: 0.75rem;
            font-weight: 500;
            opacity: 0.6;
        }

        /* Main Grid Layout */
        .main-grid {
            flex: 1;
            min-height: 0;
            width: 100%;
            padding: 1rem 2rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .main-grid {
                grid-template-columns: repeat(12, minmax(0, 1fr));
            }
            .left-col {
                grid-column: span 4 / span 4;
            }
            .right-col {
                grid-column: span 8 / span 8;
            }
        }

        .left-col, .right-col {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
            min-height: 0;
        }

        /* Album Art Card */
        .cover-card {
            width: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 2rem;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
        }

        .cover-blur {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(40px);
            opacity: 0.4;
            transform: scale(1.1);
            pointer-events: none;
        }

        .cover-art {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 1.5rem;
            filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.5));
            transition: transform 0.5s ease;
        }

        .cover-card:hover .cover-art {
            transform: scale(1.02);
        }

        /* Controller Card */
        .controller-card {
            width: 100%;
            flex-shrink: 0;
            border-radius: 2rem;
            padding: 1.25rem 1.75rem;
        }

        .song-meta {
            margin-bottom: 0.75rem;
            overflow: hidden;
        }

        .song-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.125rem;
            letter-spacing: -0.025em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-submeta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .song-artist {
            color: rgba(52, 211, 153, 0.85);
            font-weight: 500;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stream-badge {
            font-size: 0.6875rem;
            font-weight: 600;
            padding: 0.15rem 0.55rem;
            border-radius: 9999px;
            background: rgba(52, 211, 153, 0.14);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: #6ee7b7;
            letter-spacing: 0.03em;
            flex-shrink: 0;
            transition: opacity 0.2s ease;
        }

        /* Timeline / Scrubber with Interactive Thumb */
        .progress-wrapper {
            width: 100%;
            margin-bottom: 0.75rem;
            cursor: pointer;
            padding: 0.5rem 0;
        }

        .progress-track {
            height: 0.375rem;
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            position: relative;
            pointer-events: none;
            transition: height 0.15s ease;
        }

        .progress-wrapper:hover .progress-track {
            height: 0.5rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            width: 0%;
            border-radius: 9999px;
            position: relative;
            transition: background 0.2s ease;
            pointer-events: none;
        }

        .progress-bar::after {
            content: "";
            position: absolute;
            right: -0.4rem;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 0.85rem;
            height: 0.85rem;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
            transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .progress-wrapper:hover .progress-bar::after {
            transform: translateY(-50%) scale(1);
        }

        /* Mini Animated Equalizer for Active Playlist Item */
        .eq-indicator {
            margin-left: auto;
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            padding-right: 0.25rem;
            flex-shrink: 0;
        }

        .playlist-item.active .eq-indicator {
            display: flex;
        }

        .eq-bar {
            width: 3px;
            height: 4px;
            border-radius: 9999px;
            background: #34d399;
        }

        body.is-playing .playlist-item.active .eq-bar:nth-child(1) {
            animation: eqBounce 0.7s ease-in-out infinite alternate;
        }
        body.is-playing .playlist-item.active .eq-bar:nth-child(2) {
            animation: eqBounce 0.5s ease-in-out 0.15s infinite alternate;
        }
        body.is-playing .playlist-item.active .eq-bar:nth-child(3) {
            animation: eqBounce 0.65s ease-in-out 0.3s infinite alternate;
        }

        @keyframes eqBounce {
            0% { height: 3px; opacity: 0.5; }
            100% { height: 14px; opacity: 1; }
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.375rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            pointer-events: none;
        }

        /* Playback Controls */
        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
        }

        .skip-btn {
            color: rgba(255, 255, 255, 0.6);
            transition: color 0.2s ease;
        }

        .skip-btn:hover {
            color: #ffffff;
        }

        .skip-icon {
            width: 1.75rem;
            height: 1.75rem;
        }

        .play-btn {
            width: 3.5rem;
            height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #000000;
            border-radius: 9999px;
            transition: transform 0.2s ease;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        .play-icon {
            width: 1.75rem;
            height: 1.75rem;
        }

        .hidden {
            display: none !important;
        }

        /* Playlist Box */
        .playlist-card {
            width: 100%;
            height: 46%;
            border-radius: 2rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .section-heading {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
            color: rgba(255, 255, 255, 0.9);
            flex-shrink: 0;
        }

        .playlist-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-right: 0.25rem;
        }

        .playlist-empty {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.875rem;
            padding: 1rem 0.5rem;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.625rem;
            border-radius: 1rem;
            transition: background-color 0.2s ease;
            cursor: pointer;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .playlist-item.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(52, 211, 153, 0.4);
        }

        .thumb-box {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 0.75rem;
            background: #1f2937;
            overflow: hidden;
            flex-shrink: 0;
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-meta {
            overflow: hidden;
        }

        .item-title {
            font-weight: 600;
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .playlist-item.active .item-title {
            color: #34d399;
        }

        .item-artist {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Live Lyrics Preview Box */
        .preview-card {
            width: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 2rem;
            padding: 1.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .preview-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .preview-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: #34d399;
            margin-bottom: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            flex-shrink: 0;
            z-index: 20;
            position: relative;
        }

        .preview-window {
            position: relative;
            width: 100%;
            flex: 1;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, black 0%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 80%, transparent 100%);
        }

        .preview-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #ffffff;
            padding-right: 1rem;
        }

        /* Full-Screen Modal */
        .lyrics-modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            transform: translateY(100%);
            transition: transform 0.7s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex;
            flex-direction: column;
        }

        .lyrics-modal.open {
            transform: translateY(0);
        }

        .modal-close-wrap {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 50;
        }

        .modal-close-btn {
            width: 3rem;
            height: 3rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            transition: background-color 0.2s ease;
            color: #ffffff;
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-grid {
            flex: 1;
            width: 100%;
            max-width: 80rem;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
            padding: 3rem;
            height: 100%;
            align-items: center;
        }

        .modal-art-col {
            display: none;
        }

        @media (min-width: 768px) {
            .modal-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .modal-art-col {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: flex-end;
                padding-right: 3rem;
            }
        }

        .modal-cover-img {
            width: 24rem;
            height: 24rem;
            border-radius: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            object-fit: cover;
        }

        .modal-window {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 12%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 12%, black 85%, transparent);
        }

        .modal-lyrics-track {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            padding-bottom: 50vh;
            padding-right: 1.5rem;
        }

        /* Lyric Line Transitions */
        .lyric-line {
            transition: 
                transform 1.1s cubic-bezier(0.22, 1, 0.36, 1),
                color 1.1s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1),
                filter 1.1s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0.35;
            filter: blur(1px);
            transform: scale(0.95);
            transform-origin: left center;
            cursor: pointer;
            color: #ffffff;
            overflow-wrap: break-word;
        }

        .lyric-active {
            opacity: 1;
            filter: blur(0px);
            transform: scale(1.03);
            color: #ffffff;
            text-shadow: 0 0 25px rgba(52, 211, 153, 0.4);
        }

        .preview-active {
            color: #34d399;
        }

        .placeholder-text {
            color: rgba(255, 255, 255, 0.5);
        }

        .track-container {
            transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        /* Visualizer Bars */
        .vis-bar {
            width: 4px;
            height: 4px;
            border-radius: 9999px;
            background: linear-gradient(to top, #10b981, #6ee7b7);
            transition: height 0.08s ease-out, opacity 0.15s ease;
            opacity: 0.3;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(52, 211, 153, 0.5); }
    </style>
</head>
<body>

    <!-- Song-Synced Ambient Backdrop -->
    <div class="bg-ambient-wrap" aria-hidden="true">
        <img id="bg-ambient" src="" class="bg-ambient-img" alt="" referrerpolicy="no-referrer">
        <div class="bg-ambient-vignette"></div>
    </div>

    <!-- Top Navigation Bar -->
    <nav class="navbar ios-glass">
        <div class="brand">
            <svg class="brand-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
            HeaRtZ Player 
        </div>

        <div id="visualizer" class="visualizer-box"></div>

        <!-- Right Nav Actions: Playlist Button (Left) + Lyrics Button (Right) -->
        <div class="nav-actions">
            <div id="playlist-dropdown-wrapper" class="dropdown-wrapper">
                <button id="nav-playlist-btn" type="button" class="nav-playlist-btn" aria-haspopup="true" aria-expanded="false">
                    <span id="current-playlist-label">Playlist: p1</span>
                    <svg class="dropdown-caret" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <div id="playlist-dropdown-menu" class="playlist-dropdown" role="menu"></div>
            </div>

            <button id="nav-lyrics-btn" type="button" class="nav-lyrics-btn">
                Lyrics
            </button>
        </div>
    </nav>

    <!-- Main 2-Column Layout -->
    <main class="main-grid">
        
        <!-- LEFT COLUMN -->
        <div class="left-col">
            <div class="cover-card ios-glass">
                <img id="cover-blur" src="" class="cover-blur" alt="" referrerpolicy="no-referrer">
                <img id="cover-art" src="" class="cover-art" alt="Album Art" referrerpolicy="no-referrer">
            </div>

        async function safeFetchJson(urlObj, externalSignal = null) {
            if (!(urlObj instanceof URL) || urlObj.protocol !== "https:") {
                throw new Error("Untrusted request URL");
            }

            const timeoutController = new AbortController();
            const timer = setTimeout(() => timeoutController.abort(), FETCH_TIMEOUT_MS);

            const onExternalAbort = () => timeoutController.abort();
            if (externalSignal) {
                if (externalSignal.aborted) {
                    clearTimeout(timer);
                    throw new DOMException("Aborted", "AbortError");
                }
                externalSignal.addEventListener("abort", onExternalAbort, { once: true });
            }

            try {
                const response = await fetch(urlObj.toString(), {
                    signal: timeoutController.signal,
                    referrerPolicy: "no-referrer",
                    credentials: "omit",
                    headers: { "Accept": "application/json" }
                });

                if (!response.ok) {
                    const err = new Error(`HTTP ${response.status}`);
                    err.status = response.status;
                    throw err;
                }

                const contentLengthHeader = response.headers.get("content-length");
                if (contentLengthHeader !== null) {
                    const contentLength = Number.parseInt(contentLengthHeader, 10);
                    if (!Number.isFinite(contentLength) || contentLength < 0 || contentLength > MAX_JSON_BYTES) {
                        throw new Error("Payload exceeds safe byte limit");
                    }
                }

                if (!response.body || typeof response.body.getReader !== "function") {
                    throw new Error("Streaming body unavailable");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8", { fatal: false });
                let receivedBytes = 0;
                let text = "";

                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        receivedBytes += value.byteLength;
                        if (receivedBytes > MAX_JSON_BYTES) {
                            throw new Error("Stream exceeds safe byte limit");
                        }
                        text += decoder.decode(value, { stream: true });
                    }
                } catch (err) {
                    await reader.cancel().catch(() => {});
                    throw err;
                }
                text += decoder.decode();

               return JSON.parse(text);
            } finally {
                clearTimeout(timer);
                if (externalSignal) {
                    externalSignal.removeEventListener("abort", onExternalAbort);
                }
            }
        }

        // --- MULTI-MIRROR JIOSAAVN FETCHER (WORKS ON VERCEL + LOCALHOST) ---
        async function fetchAudioStream(title, artist) {
            const query = encodeURIComponent(`${title} ${artist}`);
            
            const urlsToTry = [
                `https://jiosaavn-api-privatecvc2.vercel.app/search/songs?query=${query}`,
                `https://saavnx.vercel.app/api/search/songs?query=${query}`,
                `https://saavn.sumit.co/api/search/songs?query=${query}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://jiosaavn-api-privatecvc2.vercel.app/search/songs?query=${query}`)}`,
                `https://corsproxy.io/?url=${encodeURIComponent(`https://jiosaavn-api-privatecvc2.vercel.app/search/songs?query=${query}`)}`
            ];

            const junkRegex = /\b(remix|dj|mashup|slowed|reverb|lofi|lo-fi|8d|karaoke|instrumental|ringtone|sped up)\b/i;

            for (const url of urlsToTry) {
                try {
                    const res = await safeFetchJson(new URL(url));
                    const results = res?.data?.results || res?.results;
                    
                    if (Array.isArray(results) && results.length > 0) {
                        const cleanMatch = results.find(track => {
                            const trackName = String(track?.name || track?.title || "");
                            return !junkRegex.test(trackName);
                        }) || results[0];

                        const downloads = cleanMatch?.downloadUrl || cleanMatch?.media_url;
                        if (typeof downloads === "string" && downloads.startsWith("http")) {
                            return downloads.replace(/^http:\/\//i, "https://");
                        }
                        if (Array.isArray(downloads) && downloads.length > 0) {
                            const best = downloads.find(d => d.quality === "320kbps" || d.quality === "160kbps") || downloads[downloads.length - 1];
                            const streamLink = best?.url || best?.link;
                            if (streamLink) return streamLink.replace(/^http:\/\//i, "https://");
                        }
                    }
                } catch (e) {
                    console.warn(`Mirror failed (${url}):`, e.message || e);
                }
            }
            return null;
        }

        function startVisualizer() {

        function stopVisualizer() {
            if (animFrameId !== null) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;

        function animateVisualizer() {
            if (!isPlaying || audioElement.paused) {
                stopVisualizer();
                return;
            }

            animFrameId = requestAnimationFrame(animateVisualizer);
            const half = Math.floor(BAR_COUNT / 2);
            const now = performance.now() / 1000;

            for (let i = 0; i < half; i++) {
                // Smooth multi-wave frequency Reactive Animation for cross-origin streams
                const wave1 = Math.sin(now * 6.5 - i * 0.45) * 0.5 + 0.5;
                const wave2 = Math.sin(now * 11.2 + i * 0.7) * 0.5 + 0.5;
                const envelope = Math.max(0.2, 1 - (i / half) * 0.65);
                const percent = Math.min(1, (wave1 * 0.6 + wave2 * 0.4) * envelope);

                const height = Math.max(4, Math.pow(percent, 1.3) * 32);
                const opacity = Math.max(0.3, percent + 0.1);

                const leftBar = visBars[half - 1 - i];
                const rightBar = visBars[half + i];

                if (leftBar) {

                }
            }

        function parseLRC(lrcText) {
            if (typeof lrcText !== "string") return [];
            const boundedText = lrcText.length > MAX_LYRIC_CHARS ? lrcText.slice(0, MAX_LYRIC_CHARS) : lrcText;
            const lines = boundedText.split(/\r?\n/, MAX_LYRIC_LINES);
            const result = [];
            const timeTagGlobal = /\[(\d{1,3}):(\d{2}(?:\.\d+)?)\]/g;

            for (const rawLine of lines) {
                let matches = [...rawLine.matchAll(timeTagGlobal)];
                if (matches.length === 0) continue;

                matches = matches.slice(0, 10);

                const cleanText = sanitizeText(rawLine.replace(timeTagGlobal, ""), MAX_LINE_CHARS);
                if (!cleanText) continue;

                for (const match of matches) {
                    const mins = Number.parseInt(match[1], 10);
                    const secs = Number.parseFloat(match[2]);
                    const time = mins * 60 + secs;

                    if (Number.isFinite(time) && time >= 0 && time <= MAX_SONG_DURATION_SEC && result.length < MAX_LYRIC_LINES) {
                        result.push({ time, text: cleanText });
                    }
                }
            }

            return result.sort((a, b) => a.time - b.time);
        }

        function parsePlainLyrics(plainText) {
            if (typeof plainText !== "string") return [];
            const boundedText = plainText.length > MAX_LYRIC_CHARS ? plainText.slice(0, MAX_LYRIC_CHARS) : plainText;
            const lines = boundedText.split(/\r?\n/, MAX_LYRIC_LINES);
            const result = [];

            for (const rawLine of lines) {
                const cleanText = sanitizeText(rawLine, MAX_LINE_CHARS);
                if (cleanText && result.length < MAX_LYRIC_LINES) {
                    result.push({ time: null, text: cleanText });
                }
            }
            return result;
        }

        async function fetchTrackLyricsData(title, artist, signal) {

            const searchUrl = new URL("https://lrclib.net/api/search");
            searchUrl.searchParams.set("track_name", title);
            searchUrl.searchParams.set("artist_name", artist);
            let searchData = await safeFetchJson(searchUrl, signal);

            if (!Array.isArray(searchData) || searchData.length === 0) {
                const broadUrl = new URL("https://lrclib.net/api/search");
                broadUrl.searchParams.set("q", `${title} ${artist}`);
                searchData = await safeFetchJson(broadUrl, signal);
            }

            if (!Array.isArray(searchData)) return null;

            return (
                searchData.find(track => track && typeof track.syncedLyrics === "string" && track.syncedLyrics.trim().length > 0) ||
                searchData.find(track => track && typeof track.plainLyrics === "string" && track.plainLyrics.trim().length > 0) ||
                null
            );
        }

        async function fetchLyrics(title, artist, targetIndex, targetPlaylistKey = currentPlaylistKey) {
            if (lyricsAbortController) {
                lyricsAbortController.abort();
            }
            lyricsAbortController = new AbortController();
            const currentSignal = lyricsAbortController.signal;

            setLyricsStatus("Fetching synced lyrics...");
            
            previewTrack.style.top = "0px";
            previewTrack.style.transform = "translateY(0px)";
            lyricsContainer.style.transform = "translateY(0px)";
            
            syncedLyrics = [];
            currentLyricIndex = -1;

            try {
                const match = await fetchTrackLyricsData(title, artist, currentSignal);
                if (targetIndex !== currentSongIndex || targetPlaylistKey !== currentPlaylistKey) return;

                if (match && typeof match.syncedLyrics === "string") {
                    syncedLyrics = parseLRC(match.syncedLyrics);
                    if (syncedLyrics.length > 0) {
                        renderLyricsNodes(true);
                        return;
                    }
                }

                if (match && typeof match.plainLyrics === "string") {
                    const plainLines = parsePlainLyrics(match.plainLyrics);
                    if (plainLines.length > 0) {
                        syncedLyrics = plainLines;
                        renderLyricsNodes(false);
                        return;
                    }
                }

                setLyricsStatus("No lyrics found for this track.");
            } catch (error) {
                if (error.name === "AbortError") return;
                if (targetIndex === currentSongIndex && targetPlaylistKey === currentPlaylistKey) {
                    setLyricsStatus("Could not load lyrics.");
                }
            }
        }

        function renderLyricsNodes(isSynced) {
            lyricsContainer.replaceChildren();
            previewTrack.replaceChildren();
            modalLyricNodes = [];
            previewLyricNodes = [];

            syncedLyrics.forEach((line) => {
                const pModal = document.createElement("p");
                pModal.className = "lyric-line";
                pModal.textContent = line.text;
                
                const pPreview = document.createElement("p");
                pPreview.className = "lyric-line";
                pPreview.textContent = line.text;

                if (isSynced && Number.isFinite(line.time)) {
                    const jumpToTime = (e) => {
                        e.stopPropagation();
                        if (Number.isFinite(line.time) && line.time >= 0) {
                            audioElement.currentTime = line.time;
                            if (!isPlaying) togglePlay();
                        }
                    };
                    pModal.addEventListener("click", jumpToTime);
                    pPreview.addEventListener("click", jumpToTime);
                } else {
                    pModal.classList.add("lyric-active");
                    pPreview.classList.add("lyric-active");
                }

                lyricsContainer.appendChild(pModal);
                previewTrack.appendChild(pPreview);
                modalLyricNodes.push(pModal);
                previewLyricNodes.push(pPreview);
            });

            if (isSynced && modalLyricNodes.length > 0) {
                modalLyricNodes[0].classList.add("lyric-active");
                previewLyricNodes[0].classList.add("lyric-active", "preview-active");
            }
        }

        // --- PLAYLIST DROPDOWN LOGIC ---
        function renderPlaylistDropdown() {
            playlistDropdownMenu.replaceChildren();
            dropdownItemNodes.clear();

            Object.keys(playlists).forEach((key) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = `dropdown-item${key === currentPlaylistKey ? " active" : ""}`;
                btn.setAttribute("role", "menuitem");

                const nameSpan = document.createElement("span");
                nameSpan.textContent = key;

                const countSpan = document.createElement("span");
                countSpan.className = "dropdown-count";
                countSpan.textContent = `${playlists[key].length} songs`;

                btn.appendChild(nameSpan);
                btn.appendChild(countSpan);

                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    selectPlaylist(key);
                    closePlaylistDropdown();
                });

                playlistDropdownMenu.appendChild(btn);
                dropdownItemNodes.set(key, btn);
            });
        }

        function togglePlaylistDropdown(e) {
            e.stopPropagation();
            const isOpen = playlistDropdownWrapper.classList.toggle("open");
            navPlaylistBtn.setAttribute("aria-expanded", String(isOpen));
        }

        function closePlaylistDropdown() {
            playlistDropdownWrapper.classList.remove("open");
            navPlaylistBtn.setAttribute("aria-expanded", "false");
        }

        function selectPlaylist(playlistKey) {
            if (!Object.prototype.hasOwnProperty.call(playlists, playlistKey)) return;

            currentPlaylistKey = playlistKey;
            playlist = playlists[currentPlaylistKey];
            currentSongIndex = 0;

            currentPlaylistLabel.textContent = `Playlist: ${playlistKey}`;
            playlistHeading.textContent = `Playlist — ${playlistKey}`;

            dropdownItemNodes.forEach((node, key) => {
                node.classList.toggle("active", key === currentPlaylistKey);
            });

            renderPlaylist();

            if (playlist.length > 0) {
                loadSong(0);
                if (isPlaying) {
                    audioElement.play().then(startVisualizer).catch((err) => {
                        if (err.name !== "AbortError") stopVisualizer();
                    });
                }
                preloadAllCovers(currentPlaylistKey);
            } else {
                // Handle empty playlist cleanly
                if (lyricsAbortController) lyricsAbortController.abort();
                currentStreamId++; // Cancel active audio fetches
                audioElement.pause();
                audioElement.removeAttribute("src");
                audioElement.load();
                isPlaying = false;
                playIcon.classList.remove("hidden");
                pauseIcon.classList.add("hidden");
                stopVisualizer();

                titleEl.textContent = "No songs in playlist";
                artistEl.textContent = `Playlist ${playlistKey} is empty`;
                coverArt.src = DEFAULT_COVER;
                coverBlur.src = DEFAULT_COVER;
                lyricsCover.src = DEFAULT_COVER;
                progressBar.style.width = "0%";
                currentTimeEl.textContent = "0:00";
                totalTimeEl.textContent = "0:00";
                setLyricsStatus(`No tracks available in ${playlistKey}.`);
            }
        }

        function renderPlaylist() {
            playlistContainer.replaceChildren();
            playlistItemNodes = [];
            playlistThumbNodes = [];

            if (playlist.length === 0) {
                const emptyMsg = document.createElement("p");
                emptyMsg.className = "playlist-empty";
                emptyMsg.textContent = `No songs added to ${currentPlaylistKey} yet.`;
                playlistContainer.appendChild(emptyMsg);
                return;
            }

            playlist.forEach((song, index) => {
                const isCurrent = index === currentSongIndex;
                const cacheKey = getCacheKey(currentPlaylistKey, index);

                const item = document.createElement("div");
                item.className = `playlist-item${isCurrent ? " active" : ""}`;

                const thumbBox = document.createElement("div");
                thumbBox.className = "thumb-box";

                const thumbImg = document.createElement("img");
                thumbImg.src = sanitizeImageUrl(coverCache.get(cacheKey));
                thumbImg.className = "thumb-img";
                thumbImg.alt = "Album thumbnail";
                thumbImg.referrerPolicy = "no-referrer";
                thumbBox.appendChild(thumbImg);

                const metaDiv = document.createElement("div");
                metaDiv.className = "item-meta";

                const titleP = document.createElement("p");
                titleP.className = "item-title";
                titleP.textContent = song.title;

                const artistP = document.createElement("p");
                artistP.className = "item-artist";
                artistP.textContent = song.artist;

                metaDiv.appendChild(titleP);
                metaDiv.appendChild(artistP);

                const eqDiv = document.createElement("div");
                eqDiv.className = "eq-indicator";
                for (let b = 0; b < 3; b++) {
                    const bar = document.createElement("span");
                    bar.className = "eq-bar";
                    eqDiv.appendChild(bar);
                }

                item.appendChild(thumbBox);
                item.appendChild(metaDiv);
                item.appendChild(eqDiv);

                item.addEventListener("click", () => {
                    currentSongIndex = index;
                    loadSong(currentSongIndex);
                    if (!isPlaying) {
                        togglePlay();
                    } else {
                        audioElement.play().then(startVisualizer).catch((err) => {
                            if (err.name !== "AbortError") stopVisualizer();
                        });
                    }
                });

                playlistContainer.appendChild(item);
                playlistItemNodes.push(item);
                playlistThumbNodes.push(thumbImg);
            });

            updatePlaylistHighlight();
        }

        function updatePlaylistHighlight() {
            playlistItemNodes.forEach((node, idx) => {
                node.classList.toggle("active", idx === currentSongIndex);
            });
            const activeItem = playlistItemNodes[currentSongIndex];
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        }

        async function loadSong(index) {
            const song = playlist[index];
            if (!song) return;

            const cacheKey = getCacheKey(currentPlaylistKey, index);
            const streamId = ++currentStreamId; // Protects against rapid skipping while fetching
            
            // Clean slate for new track
            audioElement.pause();
            audioElement.removeAttribute("src");
            audioElement.load();
            
            titleEl.textContent = song.title;
            artistEl.textContent = song.artist;
            
            const initialCover = sanitizeImageUrl(coverCache.get(cacheKey));
            syncAllArtwork(initialCover);
            
            progressBar.style.width = "0%";
            currentTimeEl.textContent = "0:00";
            totalTimeEl.textContent = "0:00";
            setStreamStatus("Fetching stream...");

            if (playlistItemNodes.length === 0) {
                renderPlaylist();
            } else {
                updatePlaylistHighlight();
            }

            // Fire parallel background fetches
            fetchCoverArt(song, index, currentPlaylistKey);
            fetchLyrics(song.title, song.artist, index, currentPlaylistKey);
            
            // Fetch audio stream via JioSaavn wrapper
            const streamUrl = await fetchAudioStream(song.title, song.artist);
            
            // Exit if user already skipped to a different song
            if (streamId !== currentStreamId) return; 
            
            if (streamUrl) {
                const safeStream = sanitizeStreamUrl(streamUrl);
                if (safeStream) {
                    audioElement.src = safeStream;
                    setStreamStatus("");
                    
                    if (isPlaying) {
                        document.body.classList.add("is-playing");
                        audioElement.play().then(startVisualizer).catch((err) => {
                            if (err.name !== "AbortError") stopVisualizer();
                        });
                    }
                } else {
                    setStreamStatus("Stream blocked");
                    if (isPlaying) stopVisualizer();
                }
            } else {
                setStreamStatus("Unavailable");
                if (isPlaying) stopVisualizer();
            }
        }

        function togglePlay() {
            if (playlist.length === 0) return;

            initAudioVisualizer();
            if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume().catch(() => {});
            }

            if (isPlaying) {
                audioElement.pause();
                playIcon.classList.remove("hidden");
                pauseIcon.classList.add("hidden");
                isPlaying = false;
                document.body.classList.remove("is-playing");
                stopVisualizer();
            } else {
                if (!audioElement.src || audioElement.src === window.location.href) {
                    playIcon.classList.add("hidden");
                    pauseIcon.classList.remove("hidden");
                    isPlaying = true;
                    document.body.classList.add("is-playing");
                    startVisualizer();
                    return;
                }

                audioElement.play().then(() => {
                    playIcon.classList.add("hidden");
                    pauseIcon.classList.remove("hidden");
                    isPlaying = true;
                    document.body.classList.add("is-playing");
                    startVisualizer();
                }).catch((err) => {
                    if (err.name === "AbortError") return;
                    playIcon.classList.remove("hidden");
                    pauseIcon.classList.add("hidden");
                    isPlaying = false;
                    document.body.classList.remove("is-playing");
                    stopVisualizer();
                });
            }
        }

        function nextSong() {
            if (playlist.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                // It will auto-play once the stream fetch completes inside loadSong
                startVisualizer(); 
            }
        }

        function prevSong() {
            if (playlist.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                startVisualizer();
            }
        }

        function toggleLyrics() {
            lyricsModal.classList.toggle("open");
        }

        function formatTime(time) {
            if (Number.isNaN(time) || !Number.isFinite(time) || time < 0) return "0:00";
            const mins = Math.floor(time / 60);
            const secs = Math.floor(time % 60);
            return `${mins}:${secs < 10 ? "0" : ""}${secs}`;
        }

        function updateProgress(e) {
            const { duration, currentTime } = e.target;
            if (duration && Number.isFinite(duration)) {
                progressBar.style.width = `${Math.min(Math.max((currentTime / duration) * 100, 0), 100)}%`;
                totalTimeEl.textContent = formatTime(duration);
            }
            currentTimeEl.textContent = formatTime(currentTime);

            if (syncedLyrics.length > 0 && syncedLyrics[0].time !== null) {
                let activeIndex = -1;
                for (let i = 0; i < syncedLyrics.length; i++) {
                    if (currentTime >= syncedLyrics[i].time) {
                        activeIndex = i;
                    } else {
                        break;
                    }
                }

                if (activeIndex !== -1 && activeIndex !== currentLyricIndex) {
                    currentLyricIndex = activeIndex;

                    for (let idx = 0; idx < syncedLyrics.length; idx++) {
                        const isActive = idx === activeIndex;
                        const mLine = modalLyricNodes[idx];
                        const pLine = previewLyricNodes[idx];
                        
                        if (mLine) mLine.classList.toggle("lyric-active", isActive);
                        if (pLine) {
                            pLine.classList.toggle("lyric-active", isActive);
                            pLine.classList.toggle("preview-active", isActive);
                        }
                    }

                    const mActive = modalLyricNodes[activeIndex];
                    if (mActive) {
                        lyricsContainer.style.transform = `translateY(-${mActive.offsetTop}px)`;
                    }

                    const pActive = previewLyricNodes[activeIndex];
                    if (pActive) {
                        previewTrack.style.transform = `translateY(-${pActive.offsetTop}px)`;
                    }
                }
            }
        }

        function setProgress(e) {
            if (playlist.length === 0 || !audioElement.src || audioElement.src === window.location.href) return;
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (audioElement.duration && Number.isFinite(audioElement.duration) && rect.width > 0) {
                const ratio = Math.min(Math.max(clickX / rect.width, 0), 1);
                audioElement.currentTime = ratio * audioElement.duration;
            }
        }

        // --- EVENT LISTENERS ---
        playBtn.addEventListener("click", togglePlay);
        nextBtn.addEventListener("click", nextSong);
        prevBtn.addEventListener("click", prevSong);
        navLyricsBtn.addEventListener("click", toggleLyrics);
        closeLyricsBtn.addEventListener("click", toggleLyrics);
        previewBox.addEventListener("click", toggleLyrics);
        audioElement.addEventListener("timeupdate", updateProgress);
        audioElement.addEventListener("ended", nextSong);
        progressContainer.addEventListener("click", setProgress);

        navPlaylistBtn.addEventListener("click", togglePlaylistDropdown);
        document.addEventListener("click", (e) => {
            if (!playlistDropdownWrapper.contains(e.target)) {
                closePlaylistDropdown();
            }
        });

        // --- INITIALIZATION ---
        renderPlaylistDropdown();
        renderPlaylist();
        loadSong(currentSongIndex);
        preloadAllCovers(currentPlaylistKey);
    </script>
</body>
</html>
